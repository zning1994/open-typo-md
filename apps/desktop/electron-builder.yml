appId: com.ohgiantai.mosu
productName: Mosu
copyright: Copyright © 2026 Mosu Contributors

directories:
  output: release
  buildResources: build

# main / preload / renderer 都已由 esbuild 和 vite 打成自包含产物，
# 因此不需要把 node_modules 装进包里（也避开了 pnpm 软链接 + asar 的老坑）。
files:
  - dist/**
  - package.json

  # —— 下面两条排除，各自都实测省下了可观的体积 ——

  # 1. node_modules 整个不要。
  #
  # electron-builder **默认会把生产依赖复制进 app.asar**，`files` 里列了
  # `dist/**` 也拦不住它 —— 那是两套机制。上面那句「不需要把 node_modules
  # 装进包里」原来只是句愿望，实际一直在打包：接 mermaid 之后
  # app.asar 里躺着 8298 个 node_modules 条目、145MB。
  #
  # 之所以能整个删掉，是因为三个进程的产物都是自包含的：
  # 渲染层由 Vite 打成 chunk，main/preload 由 esbuild 打成 CJS，
  # 运行时不 require 任何外部包。加回任何一条运行时依赖之前，
  # 必须先确认它是否需要在这里开口子。
  - '!node_modules/**'

  # 2. source map 不进安装包。
  #
  # 它们占了渲染层产物的七成上下（接 mermaid 之后 18MB 对 5.5MB），
  # 而打包版的开发者工具是关着的，用户手里根本用不上。
  # 构建输出里仍然生成，本地调试与 CI 产物照常可用。
  - '!dist/**/*.map'

asar: true

extraMetadata:
  main: dist/main/index.cjs
  # 覆盖掉带 scope 的包名 `@mosu/desktop`：deb / rpm 会拿它当包名，
  # `@` 和 `/` 在文件路径里非法，构建会直接失败
  name: mosu

# 显式指定产物文件名，同样是为了不让 scope 名漏进文件路径
# 刻意写死无空格的 slug，不用 ${productName} —— 产品名里有空格，
# 而空格进文件路径是自找麻烦（M0 已经因为 scope 名进路径吃过一次亏）
artifactName: Mosu-${version}-${arch}.${ext}

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
  - ext: markdown
    name: Markdown Document
    role: Editor

# 未配置证书时给 macOS 包打临时签名，否则 Apple Silicon 上根本起不来
# （表现为「已损坏，无法打开」）。详见脚本内的说明。
afterPack: scripts/after-pack.mjs

mac:
  category: public.app-category.productivity
  # 1024×1024 的 PNG，electron-builder 自己派生出整套 icns。
  # macOS 的图标规范要求四周留白（系统会再加圆角与阴影），所以这张比
  # Windows / Linux 那两套留得多 —— 生成脚本里两种边距是分开算的
  icon: build/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

  # —— 签名策略：这里刻意什么都不写死 ——
  #
  # `identity` **不设置**时，electron-builder 去钥匙串里找证书，找不到就跳过
  # 签名（不报错）。于是同一份配置在两种场景下都对：
  #
  # - CI / 本地没有证书：跳过签名，随后 `afterPack` 补一个 ad-hoc 签名，
  #   让包在 Apple Silicon 上至少能跑起来（见 scripts/after-pack.mjs）；
  # - 配了 CSC_LINK：正常签名，`hardenedRuntime` 默认就是 true，
  #   `build/entitlements.mac.plist` 与 `.inherit.plist` 会被自动采用。
  #
  # 早先这里写着 `identity: null`（= 永不签名）。那在「还没有证书」的阶段是对的，
  # 但它会**把配了证书的那条路也堵死**，属于把临时状态固化进配置。
  #
  # 公证由 release.yml 在检测到 APPLE_TEAM_ID 时用 `-c.mac.notarize=true` 打开 ——
  # 写在这里的话，没有凭据的构建会直接失败。
  # 完整的发布清单见 docs/design/07 §6。

win:
  # 多尺寸 .ico（16…256）。16px 是任务栏和文件列表里最常出现的尺寸，
  # 直接缩原图会让笔画细到看不见 —— 生成脚本先按内容包围盒裁掉留白再排版
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

# 便携版与安装版**都是 .exe**，套同一个全局 artifactName 会解析成同一个文件名，
# 后打的覆盖先打的。给便携版单独一个命名模板 —— 这个冲突只在 release 的全量
# 矩阵里才出现（CI 只打 nsis），所以它一直藏着
portable:
  artifactName: Mosu-${version}-${arch}-portable.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  # 一个装着 `<尺寸>x<尺寸>.png` 的目录 —— Linux 桌面环境按尺寸各取所需，
  # 给单张图的话某些环境会自己缩，缩出来很糊
  icon: build/icons
  # 必须显式指定：否则 electron-builder 会从包名 `@mosu/desktop` 推出
  # `@mosudesktop`，而 AppImage 不接受文件名里的 `@`
  executableName: mosu
  category: Office
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  desktop:
    entry:
      MimeType: text/markdown;text/x-markdown;

publish:
  provider: github
  releaseType: draft
