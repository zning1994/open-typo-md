appId: io.typo.editor
productName: Typo
copyright: Copyright © 2026 Typo Contributors

directories:
  output: release
  buildResources: build

# main / preload / renderer 都已由 esbuild 和 vite 打成自包含产物，
# 因此不需要把 node_modules 装进包里（也避开了 pnpm 软链接 + asar 的老坑）。
files:
  - dist/**
  - package.json

asar: true

extraMetadata:
  main: dist/main/index.cjs
  # 覆盖掉带 scope 的包名 `@typo/desktop`：deb / rpm 会拿它当包名，
  # `@` 和 `/` 在文件路径里非法，构建会直接失败
  name: typo

# 显式指定产物文件名，同样是为了不让 scope 名漏进文件路径
artifactName: ${productName}-${version}-${arch}.${ext}

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
  - ext: markdown
    name: Markdown Document
    role: Editor

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # 未配置签名证书时打出未签名包，便于 CI 与本地试用；
  # 正式发布必须配置签名与公证（docs/design/07 §6）
  identity: null

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  # 必须显式指定：否则 electron-builder 会从包名 `@typo/desktop` 推出
  # `@typodesktop`，而 AppImage 不接受文件名里的 `@`
  executableName: typo
  category: Office
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  desktop:
    entry:
      MimeType: text/markdown;text/x-markdown;

publish:
  provider: github
  releaseType: draft
