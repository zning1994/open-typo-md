appId: com.ohgiantai.typo
productName: Brainforge Typo
copyright: Copyright © 2026 Brainforge Typo Contributors

directories:
  output: release
  buildResources: build

# main / preload / renderer 都已由 esbuild 和 vite 打成自包含产物，
# 因此不需要把 node_modules 装进包里（也避开了 pnpm 软链接 + asar 的老坑）。
files:
  - dist/**
  - package.json

  # —— 下面两条排除，各自都实测省下了可观的体积 ——

  # 1. node_modules 整个不要。
  #
  # electron-builder **默认会把生产依赖复制进 app.asar**，`files` 里列了
  # `dist/**` 也拦不住它 —— 那是两套机制。上面那句「不需要把 node_modules
  # 装进包里」原来只是句愿望，实际一直在打包：接 mermaid 之后
  # app.asar 里躺着 8298 个 node_modules 条目、145MB。
  #
  # 之所以能整个删掉，是因为三个进程的产物都是自包含的：
  # 渲染层由 Vite 打成 chunk，main/preload 由 esbuild 打成 CJS，
  # 运行时不 require 任何外部包。加回任何一条运行时依赖之前，
  # 必须先确认它是否需要在这里开口子。
  - '!node_modules/**'

  # 2. source map 不进安装包。
  #
  # 它们占了渲染层产物的七成上下（接 mermaid 之后 18MB 对 5.5MB），
  # 而打包版的开发者工具是关着的，用户手里根本用不上。
  # 构建输出里仍然生成，本地调试与 CI 产物照常可用。
  - '!dist/**/*.map'

asar: true

extraMetadata:
  main: dist/main/index.cjs
  # 覆盖掉带 scope 的包名 `@typo/desktop`：deb / rpm 会拿它当包名，
  # `@` 和 `/` 在文件路径里非法，构建会直接失败
  name: brainforge-typo

# 显式指定产物文件名，同样是为了不让 scope 名漏进文件路径
# 刻意写死无空格的 slug，不用 ${productName} —— 产品名里有空格，
# 而空格进文件路径是自找麻烦（M0 已经因为 scope 名进路径吃过一次亏）
artifactName: BrainforgeTypo-${version}-${arch}.${ext}

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
  - ext: markdown
    name: Markdown Document
    role: Editor

# 未配置证书时给 macOS 包打临时签名，否则 Apple Silicon 上根本起不来
# （表现为「已损坏，无法打开」）。详见脚本内的说明。
afterPack: scripts/after-pack.mjs

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # 未配置签名证书时打出未签名包，便于 CI 与本地试用；
  # 正式发布必须配置签名与公证（docs/design/07 §6）
  identity: null

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  # 必须显式指定：否则 electron-builder 会从包名 `@typo/desktop` 推出
  # `@typodesktop`，而 AppImage 不接受文件名里的 `@`
  executableName: brainforge-typo
  category: Office
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  desktop:
    entry:
      MimeType: text/markdown;text/x-markdown;

publish:
  provider: github
  releaseType: draft
