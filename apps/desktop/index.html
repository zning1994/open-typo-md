<!doctype html>
<!-- data-typo-theme 预置默认值：等 JS 读完设置再挂的话，启动瞬间会闪一下无样式白底 -->
<html lang="zh-CN" data-typo-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brainforge Typo</title>
  </head>
  <body>
    <div id="workspace" class="workspace">
      <div class="editor-column">
        <!-- 只有一个标签时整条隐藏：单文档场景不该为标签页付出一行高度 -->
        <div id="tab-bar" class="tab-bar" role="tablist" hidden></div>
        <main id="editor" class="editor-host"></main>
      </div>
    </div>
    <footer class="status-bar">
      <span id="status-name" class="status-name">未命名.md</span>
      <span id="status-meta" class="status-meta"></span>
      <span class="status-spacer"></span>
      <span id="status-stats" class="status-stats">0 字</span>
      <button id="status-focus" type="button" class="status-mode" aria-pressed="false"></button>
      <button
        id="status-typewriter"
        type="button"
        class="status-mode"
        aria-pressed="false"
      ></button>
      <button id="status-mode" type="button" class="status-mode" aria-pressed="false">
        实时预览
      </button>
    </footer>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
