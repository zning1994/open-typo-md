name: Bug report
description: Something behaves incorrectly
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Found a security problem?** Do not file it here — use
        [private reporting](https://github.com/zning1994/mosu/security) instead.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Opened a document containing a table
        2. Pressed Tab in the last cell
        3. Expected a new row; the cursor jumped out of the table instead
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: The smallest document that triggers it
      description: |
        Paste the Markdown source, not a screenshot of it. Most bugs in this project
        depend on the exact bytes — trailing spaces, line endings, where the cursor
        is. A 3-line document that reproduces beats a 300-line one that also does.
      render: markdown
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Help → About, or the build you downloaded. If you built from source, the commit.
      placeholder: v0.1.0 / commit abc1234
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Screenshots or a screen recording help for anything visual. If the app
        crashed, the console output (View → Toggle Developer Tools) helps more.
    validations:
      required: false
