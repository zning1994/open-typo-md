# 关掉「空白 issue」入口：不是为了拦人，是为了让「这是个 bug 还是个建议」
# 在开单的那一刻就分清楚。两个模板都留了自由填写的地方。
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/zning1994/mosu/security/advisories/new
    about: Report privately. Please do not open a public issue for security problems.
  - name: Question or idea
    url: https://github.com/zning1994/mosu/discussions
    about: For anything that is not yet a bug report or a concrete request.
