name: CI

# **只有可能影响产品的改动才跑这条。**
#
# 改一行文档要等三平台 e2e 跑完，等的是一件跟它毫无关系的事。下面这份
# `paths-ignore` 把那类改动摘出去，交给 `docs.yml`（更快，且**不是不跑**）。
#
# 两份清单必须是**互补**的：这里 ignore 掉的，`docs.yml` 必须接住。原因是仓库
# 里没有 pre-commit 钩子（07 §5 曾经声称有，其实没装），`pnpm format:check`
# 只有 CI 这一道 —— 哪条路径两边都不跑，那条路径的格式就没人管了，
# 而它的报应是下一次改代码时 CI 莫名其妙地红，且跟那次改动无关。
#
# `.github/workflows/ci.yml` **刻意不在**下面这份清单里：改 CI 自己当然要跑 CI。
#
# 下面这份清单出现两次（push 与 pull_request 各一份），改一处必须改另一处。
# 想用 YAML 锚点（`&`/`*`）合并 —— **不行，GitHub Actions 的解析器不支持锚点**，
# 写了会直接报解析错误。
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright 只用来驱动 Electron，不需要它自带的浏览器二进制
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

# 刻意不设 ELECTRON_SKIP_BINARY_DOWNLOAD —— 所有 job 都完整安装 Electron。
#
# 曾经为了给 check job 省一分钟而设了它，代价是连着两轮 CI 全红：
# 一来 Electron 的安装脚本判断的是「变量有没有被设置」而不是它的值，
# 设成 '0' 照样跳过；二来 pnpm 会把「没装二进制」的安装结果缓存进共享 store，
# 污染后面真正需要它的 job。省下的一分钟远不如这两笔调试成本。
#
# ## action 的版本别往回退
#
# Node 20 的弃用警告来自 action **自己**在 `action.yml` 里声明的 `runs.using`，
# 只能靠升到声明了 node24 的版本来消掉 —— 改我们这边的 `node-version` 没有用，
# 那管的是 `run:` 步骤。
#
# 全仓在用的 action 逐个查过（`git clone --depth 1 --branch <tag>` 之后读
# `action.yml` 的 `runs.using`），不是按版本号猜的：
#
# | action | 我们用的 | `using` | 首个 node24 版本 |
# | --- | --- | --- | --- |
# | `actions/checkout` | v5 | node24 | v5 |
# | `actions/setup-node` | v5 | node24 | v5 |
# | `actions/upload-artifact` | v7 | node24 | **v6** |
# | `pnpm/action-setup` | v6 | node24 | v5 |
# | `actions/configure-pages` | v6 | node24 | v6 |
# | `actions/deploy-pages` | v5 | node24 | v5 |
# | `actions/upload-pages-artifact` | v5 | composite | — |
#
# 两条踩过的坑，都不是看版本号能看出来的：
#
# 1. **`upload-artifact@v5` 仍然是 node20。** 顺手升一个大版本修不掉这个警告。
# 2. **`upload-pages-artifact` 是 composite**，它自己不声明运行时；Pages 那条
#    警告其实来自它**内部**调的 `upload-artifact`（v3 内部是 v4，v5 内部是 v7）。
#
# 还有一条踩坑的方式：这些警告会**互相遮蔽** —— 同一个 job 里报的是一份合并的
# 清单，修掉两条之后第三条才冒出来。所以要一次把全仓扫完，别只修报出来的那几个。
#
# `checkout` 与 `setup-node` 停在 v5（各自最新是 v7）：它们在 v5 上已经是
# node24，没有警告要消，为了追新而升只是白白引入变更面。
#
# `pnpm/action-setup` 从 v4 升到 v6 对我们是零风险：入参集合没变，
# 而我们一个入参都没传 —— 版本由 package.json 的 `packageManager` 决定。

jobs:
  # ── 静态检查 + 单元测试：最快的反馈，任何分支任何 PR 都跑 ──────────────
  check:
    name: 检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 分层依赖方向
        run: pnpm layers

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 格式检查
        run: pnpm format:check

      - name: 单元测试（含 CommonMark 全量语料）
        run: pnpm test -- --coverage

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── 跨平台 verify：把发布流水线的门槛提前到每次 push ──────────────────
  #
  # `check` 只在 Linux 上跑，`artifacts` 虽然三平台都跑但不跑 verify。
  # 于是 `pnpm verify` 在 macOS / Windows 上到底过不过，**只有发布时才知道**。
  # release.yml 第一次真跑就三个平台各挂各的，三条全是这个盲区里的：
  #
  # - **macOS**：`/var` 是指向 `/private/var` 的符号链接，临时目录全在它底下。
  #   拿 `mkdtemp` 的返回值直接当期望值的断言，在那边永远对不上。
  # - **macOS**：Linux 的 `/tmp` 只有一层，`../../etc/passwd` 正好落到真的
  #   `/etc/passwd`；macOS 的临时目录深在 `/var/folders/…` 里，同样的写法落在
  #   一个**不存在**的路径上，守卫走的是「路径不可访问」那条分支 —— 用例照样
  #   绿，验的却不再是白名单。
  # - **Windows**：`core.autocrlf` 把检出的文件换成 CRLF，`format:check` 报
  #   全仓 178 个文件格式不对。（根治在 `.gitattributes`，这里是那道网。）
  #
  # 前两条的共同点值得记下来：它们不是「在别的平台上会红」，而是**在 Linux 上
  # 恒绿而且验错了东西**。只在一个平台上跑的测试，沉默的方式是假阳性。
  #
  # 跑整个 verify 而不只是 `pnpm test`：门槛要跟 release.yml 那一步**一模一样**，
  # 否则这道网就是按「我猜哪些会有平台差异」织的，而这次三条里有一条不是测试。
  #
  # 不并进 `check`：那会让 e2e / bench 多等一个 Windows runner 的安装时间。
  # 单开一个跟它们并行的 job，e2e 比它长得多，墙钟上是白拿的。
  verify-cross:
    name: 验证（${{ matrix.os }}）
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 跟 release.yml 的「检查与单元测试」是同一条命令 —— 刻意的
      - name: 检查与单元测试
        run: pnpm verify

  # ── 端到端：真 Chromium + 真 Electron。IME 用例是发布门槛 ─────────────
  e2e:
    name: 端到端（${{ matrix.os }}）
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三平台的 contenteditable / IME 行为差异正是要盯住的地方
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（含 Electron 二进制）
        run: pnpm install --frozen-lockfile

      - name: 确认 Electron 二进制就位
        # 缺二进制的表现是 23 个用例一起报「Electron failed to install correctly」，
        # 排查起来绕远路。在这里直接把问题暴露在安装环节
        # electron 是 apps/desktop 的 devDependency，pnpm 不会提升到仓库根，
        # 所以必须在这个目录下解析
        working-directory: apps/desktop
        run: node -e "const p=require('electron'); require('node:fs').accessSync(p); console.log('electron ->', p)"

      - name: 构建
        run: pnpm build

      # Linux runner 上没有 X server，Electron 起不来，必须套一层虚拟显示
      - name: 端到端测试（Linux）
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
        env:
          CI: 'true'

      - name: 端到端测试
        if: runner.os != 'Linux'
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── 性能基准：只在 Linux 上跑一次 ───────────────────────────────────
  #
  # **时间指标不卡门槛**，只写进 job summary 跟基线并排显示。共享 runner 上
  # 同一份代码连着跑三次能差出两三倍，设成硬门槛的结果是一半的 PR 随机变红，
  # 然后所有人学会点 re-run —— 那比没有门槛更糟。理由完整版在
  # scripts/bench/run.mjs 的文件头。
  #
  # 唯一的硬门槛是**主 bundle 体积**：它是确定性的，同一份代码在任何机器上
  # 打出来都是同样的字节数。这道门槛守的是 07 §2 那句「Mermaid / KaTeX /
  # 语言高亮包一律懒加载，禁止进主 bundle」—— 谁不小心把它们静态 import 了，
  # 体积会立刻蹦上去。
  bench:
    name: 性能基准
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（含 Electron 二进制）
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 跑基准
        id: bench
        run: xvfb-run -a pnpm bench | tee bench.txt

      - name: 写进 summary
        if: always()
        run: |
          {
            echo "## 性能基准"
            echo
            sed -n '/^| 指标/,$p' bench.txt
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 构建产物：每次 push 到 main / 手动触发时产出可直接下载试用的包 ────
  #
  # 这里刻意**只打「宿主架构 + 一种格式」**，而不是 electron-builder.yml 里
  # 配置的全量目标。全量意味着每个平台 3–4 个安装包各约 100MB，
  # 一次 push 就产出 1.2GB 产物、还多花几分钟 —— 而这些包的用途只是
  # 「下载下来试一下这个 commit」，一种格式足够。
  #
  # 正式发布（release.yml）不受影响，那里跑的是 electron-builder.yml 的全量矩阵。
  artifacts:
    name: 安装包（${{ matrix.os }}）
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux AppImage --x64
            label: linux-x64-AppImage
          - os: windows-latest
            targets: --win nsis --x64
            label: windows-x64-setup-exe
          # GitHub 的 macos-latest runner 现在是 Apple Silicon
          - os: macos-latest
            targets: --mac dmg --arm64
            label: macos-arm64-dmg
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（含 Electron 二进制）
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 打包
        # 未配置签名证书，产出的是未签名包，仅供内部试用
        run: >-
          pnpm --filter @mosu/desktop exec electron-builder
          --config electron-builder.yml --publish never ${{ matrix.targets }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 打包产物的冒烟测试。
      #
      # e2e 跑的是**源码目录**，验不到「装进 asar 之后还能不能起来」——
      # 而打包配置的改动恰恰只在产物里才出问题。这条是被一个真实事故逼出来的：
      # electron-builder 默认会把生产依赖复制进 app.asar，`files` 里列了
      # `dist/**` 也拦不住（那是两套机制），app.asar 一度是 145MB。
      # 排掉 node_modules 之后必须有东西证明产物还能跑。
      #
      # 只在 Linux 上跑：xvfb 现成，而这条验的是打包配置，跟平台无关。
      - name: 冒烟测试打包产物
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run -a node ../../e2e/packaged.smoke.mjs

      # 名字里写清平台/架构/格式：Actions 页面上显示的是「产物包」的名称，
      # 不是文件名（GitHub 一律把产物打成 zip），叫得含糊会让人以为安装包没后缀
      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: mosu-${{ matrix.label }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          retention-days: 14
          if-no-files-found: warn
