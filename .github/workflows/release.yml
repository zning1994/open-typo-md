name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0）。**留空**＝拿当前分支试跑：照常签名公证，但不建 Release，产物走 artifact'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: 发布（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # **串行跑，不是为了省资源。**
      #
      # 真发布时三个平台都带 `--publish always`，而草稿 release 是「没有就建一个」——
      # 并发时三个作业会同时发现「没有」然后各建一个，结果是产物散落在两三个
      # 草稿里，或者其中两个直接报「已存在」失败。electron-builder 的这个竞态
      # 是已知的，上游没打算修（发布本来就不该并发）。
      #
      # 代价是墙钟时间从 ~6 分钟变成 ~18 分钟。发布一个版本一年也没几次。
      max-parallel: 1
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    env:
      # **发布与否取决于有没有 tag，不取决于怎么触发的。**
      #
      # 留一条「不发布」的路，是因为验证签名配置本来不该以「先造一个 tag」为代价：
      # tag 是发布语义的东西，推错了要删、删了本地还留着，而这里要回答的问题
      # 只是「那五个 secret 配对了没有」。留空跑一次，签名公证照做，
      # 产物走 artifact，Release 那边一片安静。
      #
      # push tag 触发时 `github.event.inputs` 是 null，所以第一个分支不能省 ——
      # 靠 `inputs.tag != ''` 判断的话，null 与 '' 在表达式里都会转成 0，判等成立。
      PUBLISH_MODE: ${{ (github.event_name == 'push' || github.event.inputs.tag != '') && 'always' || 'never' }}
      # `secrets` 在 step 的 `if:` 里读不到（可用的上下文里没有它），
      # 所以在 job 级 env 上过一道 —— env 是能读 secrets 的
      HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}

    steps:
      # 填了一个不存在的 tag 时，checkout 报的是「failed with exit code 1」，
      # 而且重试三次、每次等 11 秒 —— 看上去像网络抖动，实际是 ref 不存在。
      # 这一步把它换成一句能读懂的话，顺带省掉那 40 秒。
      #
      # 放在 checkout 之前：gh 只要有 token 就能查，不需要工作副本。
      - name: 核对 tag 存在
        if: github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 存在，继续发布"
          else
            echo "::error::tag \`$TAG\` 在 $REPO 里不存在。先 \`git tag $TAG && git push origin $TAG\`；或者把 tag 这一栏留空，做一次只签名、不发布的试跑。"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 发布前再跑一遍，避免打出一个测试就挂的包
      - name: 检查与单元测试
        run: pnpm verify

      # **这一步曾经不存在，于是这条流水线从来没成功过。**
      #
      # electron-builder 不构建你的应用，它只负责把已有产物装进包里。少了这步，
      # `files` 里那句 `dist/**` 匹配到的是空气，asar 打出来是空的，
      # 最后死在一句看着像文件损坏的话上：
      #
      #     Application entry file "dist/main/index.cjs" in ... is corrupted:
      #     "dist/main/index.cjs" was not found in this archive
      #
      # 本地 `pnpm --filter @mosu/desktop package` 撞不见，因为那个脚本自己带了
      # `pnpm build &&`；ci.yml 的 artifacts job 也有这一步。只有这里漏了，
      # 而 release.yml 只在 tag 上触发 —— 一次都没跑过，就一直没人撞见。
      - name: 构建
        run: pnpm build

      # 证书打不开时，electron-builder 只会转述 security(1) 的原话：
      #
      #     MAC verification failed during PKCS12 import (wrong password?)
      #
      # 那个问号底下压着两件处理方式完全不同的事，而它一句都没说。这一步把它们
      # 分开，顺便让失败发生在打包之前而不是之后。
      #
      # 有一件事这句报错**已经排除掉了**：`CSC_LINK` 是好的。能走到「校验 MAC」
      # 就说明解出来的确实是一张结构完整的 PKCS#12 —— base64 存坏的话连解析
      # 都到不了那里。所以下面只问「打不打得开」，不必再验 base64。
      - name: 核对 macOS 证书能被打开
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          cert="$RUNNER_TEMP/preflight.p12"
          printf '%s' "$CSC_LINK" | base64 -d > "$cert" 2>/dev/null || true
          if [ ! -s "$cert" ]; then
            echo "::error::CSC_LINK 解不出任何内容。重新生成：base64 -i cert.p12 | tr -d '\n' | pbcopy"
            exit 1
          fi

          keychain="$RUNNER_TEMP/preflight.keychain"
          security create-keychain -p preflight "$keychain" >/dev/null
          if security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "证书与密码对得上，继续打包"
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
          else
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            echo "::error::.p12 打不开。文件本身是完整的 PKCS#12，所以是下面两件事之一："
            echo "::error::(1) CSC_KEY_PASSWORD 跟导出时设的那个密码不一致 —— 常见于把结尾的换行或空格一起粘进了 secret。"
            echo "::error::(2) 这张 .p12 是 openssl 3 导出的。它默认用 AES-256 + SHA-256 MAC，而 macOS 的 security(1) 读不懂，密码再对也报同一句话。改用「钥匙串访问 → 我的证书 → 导出」重导一张，或者 openssl 加 -legacy 重新封装。"
            exit 1
          fi

      # 打包分成两步，不是为了好看 —— 是因为 **macOS 与 Windows 的签名证书完全
      # 不是一回事**，而 electron-builder 认的是同一个环境变量名 `CSC_LINK`。
      #
      # 合成一步的话，仓库里存一份 macOS 的 .p12，Windows 作业会拿它去做
      # Authenticode 签名，然后以一个没人看得懂的错误挂掉。分开之后，
      # 两种证书各走各的，谁也漏不到对方那边。
      - name: 打包（macOS）
        if: runner.os == 'macOS'
        # 公证只在确实配了凭据时才打开 —— 没有凭据却要求公证的话，
        # electron-builder 会直接失败，而「还没有证书」是这个项目的正常状态
        run: >-
          pnpm --filter @mosu/desktop exec electron-builder
          --config electron-builder.yml --publish ${{ env.PUBLISH_MODE }}
          ${{ secrets.APPLE_TEAM_ID != '' && '-c.mac.notarize=true' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application 证书导出的 .p12，base64 之后存进来
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 公证凭据。三个都齐了才会真的去公证（见上面那个开关）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 没配证书时关掉钥匙串自动搜索，让「跳过签名」成为确定行为
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: >-
          pnpm --filter @mosu/desktop exec electron-builder
          --config electron-builder.yml --publish ${{ env.PUBLISH_MODE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Authenticode 证书，跟 macOS 那张是两码事，所以用**另一对** secret 名
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}

      - name: 打包（Linux）
        if: runner.os == 'Linux'
        # Linux 没有代码签名这回事（AppImage 可以签，但生态里几乎没人验）
        run: >-
          pnpm --filter @mosu/desktop exec electron-builder
          --config electron-builder.yml --publish ${{ env.PUBLISH_MODE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 试跑时没有 Release 可下载，产物得有别的出口 —— 否则「签名成功」
      # 就只剩流水线里的一句话，本机跑不了 spctl / stapler 去验第二遍。
      - name: 上传产物（试跑）
        if: env.PUBLISH_MODE == 'never'
        uses: actions/upload-artifact@v7
        with:
          name: mosu-dryrun-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
          retention-days: 7
          if-no-files-found: warn

      # 产物到底签没签名，必须在 Actions 页面上一眼看得见。
      #
      # 没有这一步的话，「忘了配 secret」与「配好了」产出的是同样成功的绿勾，
      # 而两者的区别要等用户下载之后才发现 —— 那时已经发出去了。
      - name: 记录签名状态
        shell: bash
        run: |
          if [ "${{ env.PUBLISH_MODE }}" = "never" ]; then
            echo "- ℹ️ **本次是试跑**：没有建 Release，产物在本页 artifact 里（\`mosu-dryrun-*\`）。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "- **Linux**：签名不适用" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if [ -z "${{ secrets.WIN_CSC_LINK }}" ]; then
              echo "- **Windows**：⚠️ 未签名。SmartScreen 会提示「已保护你的电脑」，用户需点「更多信息 → 仍要运行」。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **Windows**：✅ 已用 Authenticode 证书签名。" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -z "${{ secrets.CSC_LINK }}" ]; then
            echo "- **macOS**：⚠️ 未签名（仅 ad-hoc）。用户首次打开会被 Gatekeeper 拦下，需在「系统设置 → 隐私与安全性」里放行。" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "- **macOS**：⚠️ 已签名但**未公证**。Gatekeeper 仍会拦截 —— 公证才是解除拦截的那一步。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **macOS**：✅ 已签名并公证，双击即开。" >> "$GITHUB_STEP_SUMMARY"
          fi
