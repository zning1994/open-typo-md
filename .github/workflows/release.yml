name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0）。**留空**＝拿当前分支试跑：照常签名公证，但不建 Release，产物走 artifact'
        required: false

permissions:
  contents: write
  # 显式写出来：只要声明了 permissions，没列到的一律变成 none。
  # 同一次运行内取 artifact 走的是 runtime token，本来不需要它 ——
  # 但哪天改成跨运行取，少这一条的报错是「artifact 不存在」，很难往权限上想。
  actions: read

# **打包与发布是两件事，拆成两个 job。**
#
# 原来是一个 job 干两件：三个平台各自 `--publish always`，各自往 Release 里塞
# 产物。那样必须串行 —— 草稿 release 的语义是「没有就建一个」，并发时三个作业
# 会同时发现「没有」然后各建一个，产物散落在两三个草稿里，或者其中两个直接报
# 「已存在」失败。当时的处理是 `max-parallel: 1`，墙钟从 ~6 分钟变成 ~18 分钟。
#
# 但**串行只是在绕开竞态，没有消掉它**。竞的是「谁来建这个 Release」，
# 那就别让打包作业去建：打包一律 `--publish never`，产物走 artifact；
# 全部成功之后，由**唯一一个** release job 下载下来统一发布。
#
# 换来三件事，第三件才是最值钱的：
#
# 1. 三个平台真正并行，墙钟回到「最慢的那个平台」；
# 2. **要么全发，要么不发。** 原来 Windows 挂了的话，Release 里已经躺着 macOS
#    的产物了 —— 一个只发了一半的版本。现在发布只在三个都绿之后发生一次；
# 3. **试跑和真发布的打包路径完全一样了。** 差别只剩「后面那个 job 跑不跑」。
#    以前 `--publish` 的取值两条路不同，意味着试跑验不到真发布那条；而这个仓库
#    刚刚才因为「从没跑过的路径」连挂四轮（见 07 §6.7）。
jobs:
  build:
    name: 打包（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    env:
      # `secrets` 在 step 的 `if:` 里读不到（可用的上下文里没有它），
      # 所以在 job 级 env 上过一道 —— env 是能读 secrets 的
      HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}

    steps:
      # 填了一个不存在的 tag 时，checkout 报的是「failed with exit code 1」，
      # 而且重试三次、每次等 11 秒 —— 看上去像网络抖动，实际是 ref 不存在。
      # 这一步把它换成一句能读懂的话，顺带省掉那 40 秒。
      #
      # 放在 checkout 之前：gh 只要有 token 就能查，不需要工作副本。
      - name: 核对 tag 存在
        if: github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 存在，继续发布"
          else
            echo "::error::tag \`$TAG\` 在 $REPO 里不存在。先 \`git tag $TAG && git push origin $TAG\`；或者把 tag 这一栏留空，做一次只签名、不发布的试跑。"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 发布前再跑一遍，避免打出一个测试就挂的包
      - name: 检查与单元测试
        run: pnpm verify

      # **这一步曾经不存在，于是这条流水线从来没成功过。**
      #
      # electron-builder 不构建你的应用，它只负责把已有产物装进包里。少了这步，
      # `files` 里那句 `dist/**` 匹配到的是空气，asar 打出来是空的，
      # 最后死在一句看着像文件损坏的话上：
      #
      #     Application entry file "dist/main/index.cjs" in ... is corrupted:
      #     "dist/main/index.cjs" was not found in this archive
      #
      # 本地 `pnpm --filter @mosu/desktop package` 撞不见，因为那个脚本自己带了
      # `pnpm build &&`；ci.yml 的 artifacts job 也有这一步。只有这里漏了，
      # 而 release.yml 只在 tag 上触发 —— 一次都没跑过，就一直没人撞见。
      - name: 构建
        run: pnpm build

      # 证书打不开时，electron-builder 只会转述 security(1) 的原话：
      #
      #     MAC verification failed during PKCS12 import (wrong password?)
      #
      # 那个问号底下压着两件处理方式完全不同的事，而它一句都没说。这一步把它们
      # 分开，顺便让失败发生在打包之前而不是之后。
      #
      # 有一件事这句报错**已经排除掉了**：`CSC_LINK` 是好的。能走到「校验 MAC」
      # 就说明解出来的确实是一张结构完整的 PKCS#12 —— base64 存坏的话连解析
      # 都到不了那里。所以下面只问「打不打得开」，不必再验 base64。
      - name: 核对 macOS 证书能被打开
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          cert="$RUNNER_TEMP/preflight.p12"
          printf '%s' "$CSC_LINK" | base64 -d > "$cert" 2>/dev/null || true
          if [ ! -s "$cert" ]; then
            echo "::error::CSC_LINK 解不出任何内容。重新生成：base64 -i cert.p12 | tr -d '\n' | pbcopy"
            exit 1
          fi

          keychain="$RUNNER_TEMP/preflight.keychain"
          security create-keychain -p preflight "$keychain" >/dev/null
          if security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "证书与密码对得上，继续打包"
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            exit 0
          fi
          security delete-keychain "$keychain" >/dev/null 2>&1 || true

          # —— 失败了。**先给出能跟本机对照的凭据，再谈猜测。** ——
          #
          # secret 存进去就读不回来了，所以「我本机这一对是好的」跟「CI 拿到的
          # 是同一对」之间一直隔着一层。下面两条把这层捅破，而且都不泄露内容：
          # 文件哈希本来就靠密码保护，空白字符只报有无。
          echo "::error::.p12 打不开。先对照下面两条，再看后面的猜测。"
          echo "::error::CI 拿到的 .p12  sha256 = $(shasum -a 256 "$cert" | cut -d' ' -f1)"
          echo "::error::  本机对照：shasum -a 256 cert.p12　　对不上 = CSC_LINK 存的是另一个文件或截断了。"

          if [ "$(printf '%s' "$CSC_KEY_PASSWORD" | tr -d '[:space:]')" != "$CSC_KEY_PASSWORD" ]; then
            echo "::error::CSC_KEY_PASSWORD 里含有空白字符（空格 / 换行 / 制表符）。粘贴时把结尾的换行带进来是最常见的一种，重存一遍即可。"
          else
            echo "::error::CSC_KEY_PASSWORD 里没有空白字符，所以不是「粘贴时多带了换行」那种。"
          fi

          echo "::error::哈希对得上、密码也没有空白的话，就是密码本身敲错了 —— 或者这张 .p12 是 openssl 3 导出的（默认 AES-256 + SHA-256 MAC，macOS 的 security(1) 读不懂，密码再对也报同一句话）。后者用「钥匙串访问 → 我的证书 → 导出」重导一张即可。"
          exit 1

      # 打包分成两步，不是为了好看 —— 是因为 **macOS 与 Windows 的签名证书完全
      # 不是一回事**，而 electron-builder 认的是同一个环境变量名 `CSC_LINK`。
      #
      # 合成一步的话，仓库里存一份 macOS 的 .p12，Windows 作业会拿它去做
      # Authenticode 签名，然后以一个没人看得懂的错误挂掉。分开之后，
      # 两种证书各走各的，谁也漏不到对方那边。
      - name: 打包（macOS）
        if: runner.os == 'macOS'
        # 公证只在确实配了凭据时才打开 —— 没有凭据却要求公证的话，
        # electron-builder 会直接失败，而「还没有证书」是这个项目的正常状态
        run: >-
          pnpm --filter @mosu/desktop exec electron-builder
          --config electron-builder.yml --publish never
          ${{ secrets.APPLE_TEAM_ID != '' && '-c.mac.notarize=true' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application 证书导出的 .p12，base64 之后存进来
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 公证凭据。三个都齐了才会真的去公证（见上面那个开关）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 没配证书时关掉钥匙串自动搜索，让「跳过签名」成为确定行为
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: >-
          pnpm --filter @mosu/desktop exec electron-builder
          --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Authenticode 证书，跟 macOS 那张是两码事，所以用**另一对** secret 名
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}

      - name: 打包（Linux）
        if: runner.os == 'Linux'
        # Linux 没有代码签名这回事（AppImage 可以签，但生态里几乎没人验）
        run: >-
          pnpm --filter @mosu/desktop exec electron-builder
          --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # **无条件上传** —— 这是产物离开这个 job 的唯一出口，两种模式都要走。
      #
      # 试跑时它是给人下载的（否则「签名成功」就只剩流水线里的一句话，本机跑不了
      # spctl / stapler 验第二遍）；真发布时它是下面那个 release job 的输入。
      # 同一条路，所以每次试跑都在演练真发布。
      #
      # `latest*.yml` 是 electron-updater 的更新元数据。自动更新还没做（M6），
      # 现在带上只是为了那天到来时不必回头改这里 —— 但**那天要确认它确实生成了**：
      # `--publish never` 会不会跳过这些文件没有验证过。
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: mosu-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
            apps/desktop/release/latest*.yml
          retention-days: 7
          if-no-files-found: error

      # 产物到底签没签名，必须在 Actions 页面上一眼看得见。
      #
      # 没有这一步的话，「忘了配 secret」与「配好了」产出的是同样成功的绿勾，
      # 而两者的区别要等用户下载之后才发现 —— 那时已经发出去了。
      - name: 记录签名状态
        shell: bash
        run: |
          echo "- 产物已上传到本页 artifact（\`mosu-${{ matrix.os }}\`）。" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "- **Linux**：签名不适用" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if [ -z "${{ secrets.WIN_CSC_LINK }}" ]; then
              echo "- **Windows**：⚠️ 未签名。SmartScreen 会提示「已保护你的电脑」，用户需点「更多信息 → 仍要运行」。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **Windows**：✅ 已用 Authenticode 证书签名。" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -z "${{ secrets.CSC_LINK }}" ]; then
            echo "- **macOS**：⚠️ 未签名（仅 ad-hoc）。用户首次打开会被 Gatekeeper 拦下，需在「系统设置 → 隐私与安全性」里放行。" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "- **macOS**：⚠️ 已签名但**未公证**。Gatekeeper 仍会拦截 —— 公证才是解除拦截的那一步。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **macOS**：✅ 已签名并公证，双击即开。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 发布：唯一一个会碰 Release 的作业 ────────────────────────────────
  #
  # `needs: build` 意味着**三个平台全绿才会走到这里**，所以不存在「只发了一半
  # 的版本」。这也是拆 job 最主要的收益，比并行省下的那十二分钟重要。
  #
  # 判断「要不要发布」的表达式在整个文件里只出现这一处。job 的 `if:` 读不到
  # `env`（可用上下文里没有它），所以只能写在这儿 —— 好在也只需要一处。
  #
  # push tag 触发时 `github.event.inputs` 是 null，第一个分支不能省：靠
  # `inputs.tag != ''` 判断的话，null 与 '' 在表达式里都会转成 0，判等成立。
  release:
    name: 建草稿 Release
    needs: build
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: 取回三个平台的产物
        uses: actions/download-artifact@v7
        with:
          pattern: mosu-*
          path: dist
          merge-multiple: true

      - name: 建草稿并上传产物
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist

          # **草稿，不是正式发布。** 正文留空是有意的：第一个版本的 release note
          # 是「这是什么、为什么值得下」，不是变更清单，值得手写。写好之后在
          # Release 页面点 Publish 才对外可见。
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::$TAG 的 Release 已存在，往里补产物（同名文件会被覆盖）"
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" --draft --title "$TAG" \
              --notes "正文待补 —— 产物已就位，确认无误后编辑本文并点 Publish。"
          fi

          {
            echo "- ✅ 已建/更新草稿 Release **$TAG**，产物 $(ls dist | wc -l | tr -d ' ') 个。"
            echo "- ⚠️ 这是**草稿**，对外不可见。写好正文后到 Release 页面点 Publish。"
          } >> "$GITHUB_STEP_SUMMARY"
